on:
  workflow_call:
    inputs:
      config_file:
        required: true
        type: string
        description: 'The vertagus configuration file to use for commit tagging configuration'

permissions:
  contents: read

jobs:
  create-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Passed through the environment rather than interpolated into `run:`, so
      # that a value containing shell metacharacters cannot alter the command.
      CONFIG_FILE: ${{ inputs.config_file }}
    steps:
      - name: checkout repo content
        uses: actions/checkout@v4
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: install dependencies
        run: pip install -e "."
      - name: run prod version tag
        if: ${{ startsWith( github.head_ref, 'release/' ) || startsWith( github.head_ref, 'hotfix/' ) }}
        run: vertagus create-tag -c "$CONFIG_FILE" -s prod
