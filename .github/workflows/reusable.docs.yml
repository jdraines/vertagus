name: Documentation

on:
  workflow_call:
    inputs:
      dev:
        required: false
        type: boolean
        default: false
        description: 'If true, deploys to the development version of the documentation. Defaults to false.'
      set_current:
        required: false
        type: boolean
        default: true
        description: 'If true, sets the cuyrrent alias to the current version. Defaults to true.'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # --locked installs exactly what uv.lock records, so the docs build runs
        # the same resolved versions that are pinned and scanned for advisories.
        run: |
          python -m pip install --upgrade uv
          uv sync --locked --extra docs
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Show deployment context
        # Context values are passed through the environment rather than
        # interpolated into `run:`. github.head_ref is the branch name of the
        # pull request, which on a fork is chosen by someone with no write
        # access and may contain shell metacharacters -- interpolating it here
        # would run them.
        env:
          GITHUB_EVENT: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref }}
          GITHUB_HEAD_REF_NAME: ${{ github.head_ref }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          echo "GitHub Event: $GITHUB_EVENT"
          echo "GitHub Ref: $GITHUB_REF_NAME"
          echo "GitHub Head Ref: $GITHUB_HEAD_REF_NAME"
          echo "Repository: $GITHUB_REPO"

      - name: Build and deploy documentation
        env:
          CI: true
          DEPLOY_DEV: ${{ inputs.dev }}
          SET_CURRENT: ${{ inputs.set_current }}
        run: |
          VERSION=$(vertagus show-alias major.minor)
          echo "Running mike-docs.sh with dev=$DEPLOY_DEV"
          echo "Using version: $VERSION"
          git fetch origin gh-pages || echo "Failed to fetch origin gh-pages"
          if [[ "$DEPLOY_DEV" == "true" ]]; then
            echo "Deploying development documentation"
            ./scripts/mike-docs.sh deploy-dev
          else
            ./scripts/mike-docs.sh deploy "$VERSION"
            if [[ "$SET_CURRENT" == "true" ]]; then
              echo "Setting current alias to $VERSION"
              ./scripts/mike-docs.sh set-default "$VERSION"
            fi
          fi
