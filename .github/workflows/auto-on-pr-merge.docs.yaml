name: Deploy Docs on PR Merge

on:
  pull_request:
    branches: [main]
    types: [closed]
    
permissions:
  contents: write
  pages: write
  id-token: write

# No workflow-level `concurrency` here on purpose. reusable.docs.yml already
# declares the "pages" group, and it is evaluated in the caller's context: if
# this run held that group too, the workflow it calls could never acquire it.
# GitHub rejects that at startup -- the run fails in seconds with no jobs, no
# logs and "a workflow file issue". Earlier runs never showed it, because the
# `if` below was false and the called workflow was never resolved.
# manual-trigger.docs.yaml, which has always worked, omits it for this reason.

jobs:
  
  deploy_docs:
    uses: ./.github/workflows/reusable.docs.yml
    if: ${{ github.event.pull_request.merged == true && ( startsWith( github.head_ref, 'release/' ) || startsWith( github.head_ref, 'hotfix/' ) )}}
    permissions:
      contents: write
      pages: write
      id-token: write
    