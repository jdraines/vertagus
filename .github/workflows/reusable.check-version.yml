on:
  workflow_call:
    inputs:
      config_file:
        required: true
        type: string
        description: 'The vertagus configuration file to use for the version check'
      target_branch:
        required: true
        type: string
        description: 'The target branch for the version check, typically the base branch of the PR.'

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Passed through the environment rather than interpolated into `run:`, so
      # that a value containing shell metacharacters cannot alter the command.
      CONFIG_FILE: ${{ inputs.config_file }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
    steps:
      - name: checkout repo content
        uses: actions/checkout@v7
      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: 3.11
      - name: install dependencies
        run: pip install -e "."
      - name: run dev version check
        if: ${{ startsWith( github.head_ref, 'feature/' ) }}
        run: vertagus validate -c "$CONFIG_FILE" -s dev -b "$TARGET_BRANCH"
      - name: run prod version check
        if: ${{ startsWith( github.head_ref, 'release/' ) || startsWith( github.head_ref, 'hotfix/' ) }}
        run: vertagus validate -c "$CONFIG_FILE" -s prod -b "$TARGET_BRANCH"
      # `dependabot/*` is treated as `nobump/*`: a dependency bump does not
      # change the project's own version, and dependabot names its own branches,
      # so it could never satisfy a prefix gate written for human branches. Left
      # out, every dependabot PR touching pyproject.toml fails here -- on the
      # branch name alone, with neither version check having run.
      - name: deny version check
        if: ${{ !startsWith( github.head_ref, 'release/' ) && !startsWith( github.head_ref, 'hotfix/' ) && !startsWith( github.head_ref, 'feature/' ) && !startsWith( github.head_ref, 'nobump/' ) && !startsWith( github.head_ref, 'dependabot/' ) }}
        run: echo "Branch name does not match any of the expected patterns (release/, hotfix/, feature/, nobump/, dependabot/). Exiting." && exit 1
